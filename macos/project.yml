# Generate the Xcode project with XcodeGen: `brew install xcodegen && xcodegen generate`
name: RepoHub
options:
  bundleIdPrefix: com.ljwebmanagement
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Team-prefixed App Group shared by the app and the widget.
    APP_GROUP_ID: "$(TeamIdentifierPrefix)com.ljwebmanagement.repohub"

targets:
  RepoHub:
    type: application
    platform: macOS
    sources: [RepoHub, Shared]
    dependencies:
      - target: RepoHubWidget
    info:
      path: RepoHub/Info.plist
      properties:
        CFBundleDisplayName: RepoHub
        LSApplicationCategoryType: public.app-category.developer-tools
        RepoHubAppGroup: $(APP_GROUP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: com.ljwebmanagement.repohub
            CFBundleURLSchemes: [repohub]
    entitlements:
      path: RepoHub/RepoHub.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ljwebmanagement.repohub

  RepoHubWidget:
    type: app-extension
    platform: macOS
    sources: [RepoHubWidget, Shared]
    info:
      path: RepoHubWidget/Info.plist
      properties:
        CFBundleDisplayName: RepoHub
        RepoHubAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RepoHubWidget/RepoHubWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ljwebmanagement.repohub.widget
